name: Typecheck

# pyrefly 1.4 with the experimental tensor-shape stubs, gated by pyrefly-baseline.json: only
# errors that are not in the baseline fail the job. tests/typing/README.md documents the
# toolchain; tests/typing/requirements-ci.txt pins the runner to the development venv.
on:
  pull_request:
    branches: [SDTD_040_beta_release, SDTD_032_dev]
  push:
    branches: [SDTD_040_beta_release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/typing/requirements-ci.txt

      - name: Install CPU torch
        # The shape stubs provide torch's types; the real package only has to import.
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install the pinned model stack and pyrefly
        # The stubs declare torch as a dependency; --no-deps keeps pip from touching the CPU wheel.
        run: |
          pip install -r tests/typing/requirements-ci.txt
          pip install --no-deps pyrefly-torch-stubs==1.4.0

      - name: pyrefly check
        # pyproject.toml points python-interpreter-path at the Windows venv. Override it with the
        # runner's interpreter so the stubs in its site-packages resolve.
        run: >
          pyrefly check
          --baseline pyrefly-baseline.json
          --python-interpreter-path "$(which python)"
          --output-format full-text-with-github
