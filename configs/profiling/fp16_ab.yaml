# Profiling arm B — FP16 baseline for the FP8-vs-FP16 A/B (differs from fp8_fi_on.yaml
# ONLY on fp8:false and the per-CN fp8 override below).
# Engine: sdxl-turbo--h4caa2410d251--res-512x512  (built 2026-07-29, batch 2)
# Canonical: stabilityai/sdxl-turbo--tiny_vae-True--min_batch-1--max_batch-4
#            --use_cached_attn-True--fi-True--controlnet--sbatch1--batch-2--cachef4
#            --optlvl4--mode-img2img--trt10.16.1.11--cc89--res-512x512
# NOTE: the older fp16 engine hee14d1f99dde (2026-07-27) is NOT comparable — brute-forced
# identity shows batch-1, no cachef, optlvl2 (single-step t_index, unpinned cache).
# use_feature_injection MUST stay explicit true: the hash encodes the raw flag (--fi-True)
# and config.py defaults an absent key to true only by accident of the loader.
# IMPORTANT: build_engines_if_missing=false — fail if engine not present rather than rebuild

model_id: "stabilityai/sdxl-turbo"
use_lcm_lora: true  # no-op for sd_turbo (wrapper skips LCM LoRA); kept to mirror builder config

t_index_list: [13, 30]
width: 512
height: 512
device: "cuda"
dtype: "float16"

guidance_scale: 1.045
num_inference_steps: 50
seed: 2416333
delta: 1.15

prompt: "fancy banana font on circular plate"
negative_prompt: ""

mode: "img2img"
frame_buffer_size: 1
use_denoising_batch: true
use_tiny_vae: true
acceleration: "tensorrt"
cfg_type: "self"
do_add_noise: true
warmup: 10
use_safety_checker: false
skip_diffusion: false
compile_engines_only: false
build_engines_if_missing: false
static_shapes: true
fp8: false
fp8_allow_fp16_fallback: false
builder_optimization_level: 4
pin_cache_frames: true

scheduler: "lcm"
sampler: "normal"

use_cached_attn: true
cache_maxframes: 4
cache_interval: 2
use_feature_injection: true
fi_strength: 0.435
fi_threshold: 0.96
cn_cache_interval: 2

enable_similar_image_filter: false
similar_image_filter_threshold: 0.9998
similar_image_filter_max_skip_frame: 10

hf_cache: ""

engine_dir: "D:/dev/SDTD_040_Beta/StreamDiffusion/engines/td"

use_controlnet: true
controlnets:
  - model_id: "xinsir/controlnet-scribble-sdxl-1.0"
    conditioning_scale: 0.0
    preprocessor: "passthrough"
    enabled: true
    # Per-CN override (wrapper.py:2771): reuse the existing fp8 CN engine
    # (controlnet_xinsir_...--optlvl4--fp8) instead of building a missing fp16-optlvl4 one.
    # CN engines are NOT covered by build_engines_if_missing — a missing CN engine builds
    # unconditionally mid-run. Same CN binary as the fp8 arms; CN is runtime-inactive
    # (conditioning_scale 0.0) so the UNet fp8-vs-fp16 axis stays isolated.
    fp8: true

use_ipadapter: false
