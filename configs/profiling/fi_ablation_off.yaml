# Profiling arm C — FP8v3 with StreamV2V feature injection OFF (B2a ablation gate).
# Differs from fp8_fi_on.yaml ONLY on use_feature_injection: false.
# Engine: sdxl-turbo--fp8v3--h71618ea13a23--res-512x512  (built 2026-07-29, batch 2,
#         1475 layers vs FI-on's 1914 — FI graph nodes absent)
# Canonical: stabilityai/sdxl-turbo--tiny_vae-True--min_batch-1--max_batch-4
#            --use_cached_attn-True--fi-False--controlnet--fp8v3--sbatch1--batch-2--cachef4
#            --optlvl4--mode-img2img--trt10.16.1.11--cc89--res-512x512
# use_feature_injection MUST be explicit false: config.py:171-177 defaults an ABSENT key
# to true, which would silently resolve to the FI-on engine.
# IMPORTANT: build_engines_if_missing=false — fail if engine not present rather than rebuild

model_id: "stabilityai/sdxl-turbo"
use_lcm_lora: true  # no-op for sd_turbo (wrapper skips LCM LoRA); kept to mirror builder config

t_index_list: [13, 30]
width: 512
height: 512
device: "cuda"
dtype: "float16"

guidance_scale: 1.045
num_inference_steps: 50
seed: 2416333
delta: 1.15

prompt: "fancy banana font on circular plate"
negative_prompt: ""

mode: "img2img"
frame_buffer_size: 1
use_denoising_batch: true
use_tiny_vae: true
acceleration: "tensorrt"
cfg_type: "self"
do_add_noise: true
warmup: 10
use_safety_checker: false
skip_diffusion: false
compile_engines_only: false
build_engines_if_missing: false
static_shapes: true
fp8: true
fp8_allow_fp16_fallback: false
builder_optimization_level: 4
pin_cache_frames: true

scheduler: "lcm"
sampler: "normal"

use_cached_attn: true
cache_maxframes: 4
cache_interval: 2
use_feature_injection: false
fi_strength: 0.435
fi_threshold: 0.96
cn_cache_interval: 2

enable_similar_image_filter: false
similar_image_filter_threshold: 0.9998
similar_image_filter_max_skip_frame: 10

hf_cache: ""

engine_dir: "D:/dev/SDTD_040_Beta/StreamDiffusion/engines/td"

use_controlnet: true
controlnets:
  - model_id: "xinsir/controlnet-scribble-sdxl-1.0"
    conditioning_scale: 0.0
    preprocessor: "passthrough"
    enabled: true

use_ipadapter: false
